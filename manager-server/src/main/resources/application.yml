server:
  port: 5230

spring:
  application:
    name: manager-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/nms?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml

#设置日志级别，ERROR/WARN/INFO/DEBUG,默认是INFO以上才显示
logging:
  level:
    root: info


# 默认小说封面地址、默认作者头像地址、默认用户头像地址
default:
  authorAvatarUrl: https://nms.oss-cn-beijing.aliyuncs.com/authorAvatar/default.png
  visitorAvatarUrl:  https://nms.oss-cn-beijing.aliyuncs.com/visitorAvatar/default.png
  novelCoverUrl: https://nms.oss-cn-beijing.aliyuncs.com/novelCover/default.png
  managerAvatarUrl: https://nms.oss-cn-beijing.aliyuncs.com/managerAvatar/default.png