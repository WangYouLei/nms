server:
  port: 5280
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: manager-server

  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
        username: nacos
        password: 123456
      config:
        server-addr: 127.0.0.1:8848
        namespace: public
        username: nacos
        password: 123456
        file-extension: yml
        shared-configs:
          - data-id: common-config.yml
            group: DEFAULT_GROUP
            refresh: true
    openfeign:
      client:
        config:
          default:
            connect-timeout: 10000
            read-timeout: 30000
      circuitbreaker:
        enabled: true
    loadbalancer:
      ribbon:
        enabled: false

  main:
    allow-bean-definition-overriding: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/nms?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456

  mybatis-plus:
    configuration:
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    mapper-locations: classpath:mapper/*.xml

# 日志级别
logging:
  level:
    root: info
